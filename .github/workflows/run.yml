name: Update dataset and model

on:
  schedule:
    - cron: "7 * * * *"    # каждый час
  workflow_dispatch:       # ручной запуск кнопкой

permissions:
  contents: write

concurrency:
  group: update-dataset
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas numpy scikit-learn

      - name: Download dataset
        run: python fetch.py

      - name: Train model and build page
        run: python train.py

      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Update page"
          git pull --rebase
          git push
