name: Collect alerts

on:
  schedule:
    - cron: "7 * * * *"   # каждый час, на 7-й минуте
  workflow_dispatch:       # ручной запуск кнопкой

permissions:
  contents: write

concurrency:
  group: collect-alerts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch alerts
        env:
          ALERTS_TOKEN: ${{ secrets.ALERTS_TOKEN }}
          OBLAST: "Дніпропетровська область"
        run: python fetch.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.csv
          git diff --staged --quiet || git commit -m "Update snapshots"
          git pull --rebase
          git push
